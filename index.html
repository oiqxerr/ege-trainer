<script>
// Применяем сохранённую тему ДО отрисовки страницы — иначе был бы короткий
// "мигок" светлой темой перед переключением на тёмную при каждой загрузке.
(function () {
  try {
    var saved = localStorage.getItem("ege.theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}
})();
</script>
